services:
  backend:
    build: ./backend
    volumes:
      - ./backend:/app
      - /app/.venv
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    ports:
      - "3000:3000"
